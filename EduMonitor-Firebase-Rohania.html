<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EduMonitor English SMA</title><style>:root{--navy:#0b2a55;--navy2:#143a73;--acc:#2f7bff;--bg:#f2f6fc;--line:#dbe4f1;--tx:#1b2a41;--mut:#5d6f89;--ok:#1a9d5c;--bad:#d64545}

const app=initializeApp({apiKey:"AIzaSyDF-jTtVzTf4l73EQFL6sOWp58sWXo4XIs",authDomain:"rohania-english.firebaseapp.com",projectId:"rohania-english",storageBucket:"rohania-english.firebasestorage.app",messagingSenderId:"853989025850",appId:"1:853989025850:web:71570c79cc4b416f362d03"});
const db=getFirestore(app),auth=getAuth(app);
const COLS=['kelas','siswa','modul','materi','kuis','tugas','hasil','kumpul','presensi','jurnal','refleksi'];
const last={},rid=r=>r.id||r.siswa+'_'+r.tgl;
async function pull(){const d={log:[]};let n=0;
 for(const c of COLS){const s=await getDocs(collection(db,c));d[c]=s.docs.map(x=>x.data());n+=s.size;last[c]={};d[c].forEach(r=>last[c][rid(r)]=JSON.stringify(r))}
 return n?d:null}
async function push(d){
 for(const c of COLS){const ids=new Set();last[c]=last[c]||{};
  for(const r of d[c]||[]){const id=rid(r),j=JSON.stringify(r);ids.add(id);if(last[c][id]!==j){await setDoc(doc(db,c,id),r);last[c][id]=j}}
  for(const id of Object.keys(last[c]))if(!ids.has(id)){await deleteDoc(doc(db,c,id));delete last[c][id]}}}
window.fb={push,
 init:async()=>{await auth.authStateReady();if(!auth.currentUser)await signInAnonymously(auth);return pull()},
 login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
 logout:()=>signOut(auth)};
</script>

const PG={dashboard(){const ss=DB.siswa.map(s=>({s,...st(s)})),all=ss.filter(a=>a.avg!==null),av=all.length?Math.round(all.reduce((a,b)=>a+b.avg,0)/all.length):'-',ph=DB.presensi.length?Math.round(100*DB.presensi.filter(a=>a.s=='H').length/DB.presensi.length):0;
return`<div class=gr>${[['Siswa',DB.siswa.length],['Kelas',DB.kelas.length],['Kehadiran',ph+'%'],['Tugas aktif',DB.tugas.filter(t=>t.tenggat>=today()).length],['Rata-rata nilai',av]].map(a=>`<div class=st><b>${a[1]}</b><span>${a[0]}</span></div>`).join('')}</div>
<div class=card><h3>Rata-rata nilai per kelas</h3>${DB.kelas.map(k=>{const v=ss.filter(a=>a.s.kelas==k.id&&a.avg!==null),m=v.length?Math.round(v.reduce((a,b)=>a+b.avg,0)/v.length):0;return`${x(k.nama)}: ${m}<div class=hb style="width:${m}%"></div>`}).join('')}</div>
<div class=card><h3>Siswa yang memerlukan pendampingan</h3>${ss.filter(a=>(a.avg!==null&&a.avg<70)||a.hp<80).map(a=>`<p>${x(a.s.nama)} (${x(kn(a.s.kelas))}) - nilai ${a.avg??'-'}, hadir ${a.hp}%</p>`).join('')||'Semua siswa dalam kondisi baik.'}</div>
<div class=card><h3>Aktivitas terbaru</h3>${DB.log.slice(0,6).map(l=>`<p><small>${l.t}</small> ${x(l.m)}</p>`).join('')||'Belum ada aktivitas.'}</div>`},
kelas:()=>tbl('kelas'),siswa:()=>tbl('siswa'),modul:()=>tbl('modul'),materi:()=>tbl('materi'),kuis:()=>tbl('kuis'),tugas:()=>tbl('tugas'),jurnal:()=>tbl('jurnal'),
presensi(){PK=PK||(DB.kelas[0]||{}).id;const ss=DB.siswa.filter(s=>s.kelas==PK),kls=`<select onchange="PK=this.value;render()">${DB.kelas.map(k=>`<option value=${k.id} ${k.id==PK?'selected':''}>${x(k.nama)}</option>`).join('')}</select>`;
const lim=new Date(Date.now()-PP*864e5).toISOString().slice(0,10);
return`<div class=card><div class=bar>${kls}<input type=date value=${PD} onchange="PD=this.value;render()"></div><form onsubmit="svp(event)"><div class=tw><table><tr><th>Siswa</th><th>Status</th></tr>${ss.map(s=>{const c=(DB.presensi.find(a=>a.siswa==s.id&&a.tgl==PD)||{s:'H'}).s;return`<tr><td>${x(s.nama)}</td><td><select name=${s.id}>${[['H','Hadir'],['S','Sakit'],['I','Izin'],['A','Alpa']].map(o=>`<option value=${o[0]} ${c==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td></tr>`}).join('')}</table></div><button class=b>Simpan presensi</button></form></div>
<div class=card><div class=bar><h3>Rekap</h3><select onchange="PP=+this.value;render()">${[[1,'Harian'],[7,'Mingguan'],[30,'Bulanan'],[180,'Semester']].map(o=>`<option value=${o[0]} ${PP==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class=tw><table><tr><th>Siswa</th><th>H</th><th>S</th><th>I</th><th>A</th></tr>${ss.map(s=>{const p=DB.presensi.filter(a=>a.siswa==s.id&&(PP==1?a.tgl==PD:a.tgl>=lim&&a.tgl<=PD));return`<tr><td>${x(s.nama)}</td>${'HSIA'.split('').map(c=>`<td>${p.filter(a=>a.s==c).length}</td>`).join('')}</tr>`}).join('')}</table></div></div>`},
monitoring(){return`<div class=tw><table><tr><th>Siswa</th><th>Kelas</th><th>Hadir</th><th>Tugas</th><th>Nilai</th><th>Kompetensi</th><th>Rekomendasi</th><th></th></tr>${DB.siswa.map(s=>{const a=st(s);return`<tr><td>${x(s.nama)}</td><td>${x(kn(s.kelas))}</td><td>${a.hp}%</td><td>${a.kum}/${a.tg}</td><td>${a.avg??'-'}</td><td class=${a.tuntas?'ok':'bad'}>${a.avg===null?'-':a.tuntas?'Tuntas':'Belum tuntas'}</td><td>${a.rec}</td><td><a onclick="det('${s.id}')">Detail</a></td></tr>`}).join('')}</table></div>`},
laporan(){RK=RK||(DB.kelas[0]||{}).id;const ss=DB.siswa.filter(s=>s.kelas==RK);return`<div class=bar><select onchange="RK=this.value;render()">${DB.kelas.map(k=>`<option value=${k.id} ${k.id==RK?'selected':''}>${x(k.nama)}</option>`).join('')}</select><button class=b onclick="csv()">Ekspor Excel (CSV)</button><button class=b onclick="window.print()">Ekspor PDF (Cetak)</button></div><div class=tw><table><tr><th>Siswa</th><th>Kehadiran</th><th>Tugas</th><th>Rata-rata</th><th>Ketuntasan</th><th>Laporan individu</th></tr>${ss.map(s=>{const a=st(s);return`<tr><td>${x(s.nama)}</td><td>${a.hp}%</td><td>${a.kum}/${a.tg}</td><td>${a.avg??'-'}</td><td>${a.tuntas?'Tuntas':'Belum'}</td><td><a onclick="det('${s.id}')">Buka</a></td></tr>`}).join('')}</table></div>`}};
function svp(e){e.preventDefault();const f=new FormData(e.target);for(const[id,s]of f){DB.presensi=DB.presensi.filter(a=>!(a.siswa==id&&a.tgl==PD));DB.presensi.push({siswa:id,tgl:PD,s})}log('Presensi '+kn(PK)+' '+PD);save();alert('Presensi tersimpan');render()}
function det(id){const s=DB.siswa.find(a=>a.id==id),a=st(s);modal(`<h3>${x(s.nama)} - ${x(kn(s.kelas))}</h3><p>Kehadiran ${a.hp}% | Tugas ${a.kum}/${a.tg} | Rata-rata ${a.avg??'-'}</p>${a.ns.map(n=>`<div class=hb style="width:${n}%">&nbsp;${n}</div>`).join('')}<p><b>Rekomendasi:</b> ${a.rec}</p><h4>Refleksi siswa</h4>${DB.refleksi.filter(r=>r.siswa==id).map(r=>`<p><small>${r.t}</small> ${x(r.teks)}</p>`).join('')||'<p>Belum ada.</p>'}<button class=b onclick="window.print()">Cetak laporan</button>`)}
function csv(){const r=[['Nama','Kelas','Kehadiran %','Tugas','Rata-rata','Ketuntasan']];DB.siswa.filter(s=>s.kelas==RK).forEach(s=>{const a=st(s);r.push([s.nama,kn(s.kelas),a.hp,a.kum+'/'+a.tg,a.avg??'',a.tuntas?'Tuntas':'Belum'])});dl('laporan.csv','text/csv',r.map(l=>l.map(c=>`"${c}"`).join(',')).join('\n'))}
function dl(n,t,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function bk(){modal(`<h3>Cadangan data</h3><p><button class=b onclick="dl('edumonitor-backup.json','application/json',JSON.stringify(DB))">Unduh cadangan</button></p><label>Pulihkan dari berkas<input type=file accept=.json onchange="rs(this.files[0])"></label>`)}
function rs(f){const r=new FileReader;r.onload=()=>{try{DB=JSON.parse(r.result);save();closeM();render()}catch{alert('Berkas tidak valid')}};r.readAsText(f)}
function rekap(id){const q=DB.kuis.find(a=>a.id==id);modal(`<h3>Rekap ${x(q.judul)}</h3><p>Skor otomatis dihitung dari soal objektif; soal uraian dinilai manual.</p><table><tr><th>Siswa</th><th>Skor</th><th>Waktu</th></tr>${DB.hasil.filter(h=>h.kuis==id).map(h=>`<tr><td>${x(sn(h.siswa))}</td><td>${h.skor}</td><td>${h.t}</td></tr>`).join('')||'<tr><td colspan=3>Belum ada hasil</td></tr>'}</table>`)}
function nilai(id){const t=DB.tugas.find(a=>a.id==id);modal(`<h3>Penilaian: ${x(t.judul)}</h3><p>Rubrik: ${x(t.rubrik)}</p>${DB.kumpul.filter(k=>k.tugas==id).map(k=>`<form class=card onsubmit="gr(event,'${k.id}')"><b>${x(sn(k.siswa))}</b><p>${x(k.teks)}</p>${k.file?`<a onclick="pv('kumpul','${k.id}')">Lihat berkas</a>`:''}<label>Nilai<input name=n type=number min=0 max=100 value="${k.nilai}" required></label><label>Umpan balik<textarea name=u>${x(k.umpan)}</textarea></label><button class=b>Simpan nilai</button></form>`).join('')||'<p>Belum ada pengumpulan.</p>'}`)}
function gr(e,id){e.preventDefault();const k=DB.kumpul.find(a=>a.id==id);k.nilai=+e.target.n.value;k.umpan=e.target.u.value;log('Menilai tugas '+sn(k.siswa));save();alert('Nilai tersimpan');render()}
/* ---------- siswa ---------- */
const SN=[['beranda','Beranda'],['materi','Materi'],['modul','Modul'],['kuis','Kuis'],['tugas','Tugas'],['nilai','Nilai'],['refleksi','Refleksi']];
function siswaV(){const p=pg(),me=DB.siswa.find(a=>a.id==S.id);if(!me)return out();const k=S.kelas,c=SP[SN.some(n=>n[0]==p)?p:'beranda'](me,k);
return`<div class=tp><b>${x(me.nama)} - ${x(kn(k))}</b><a onclick="out()">Keluar</a></div><div class=ct><div class=tabs>${SN.map(n=>`<button class="${n[0]==p?'on':''}" onclick="location.hash='#/${n[0]}'">${n[1]}</button>`).join('')}</div>${c}</div>`}
const SP={beranda(m){const a=st(m);return`<div class=gr><div class=st><b>${a.hp}%</b><span>Kehadiran</span></div><div class=st><b>${a.kum}/${a.tg}</b><span>Tugas terkumpul</span></div><div class=st><b>${a.avg??'-'}</b><span>Rata-rata nilai</span></div></div><div class=card><h3>Halo, ${x(m.nama.split(' ')[0])}!</h3>${a.tuntas?'Kompetensimu sudah tuntas. Pertahankan!':'Terus berlatih; kerjakan kuis dan tugas yang tersedia.'}</div>`},
materi(m,k){return DB.materi.filter(a=>a.kelas==k).map(a=>`<div class=card><h3>${x(a.judul)}</h3><span class=tag>${a.ks}</span> <span class=tag>${a.tipe}</span><p>${/^https?:/.test(a.isi)?(a.tipe=='Gambar'?`<img src="${x(a.isi)}" style="max-width:100%">`:a.tipe=='Video'?`<video controls src="${x(a.isi)}" style="max-width:100%"></video>`:a.tipe=='Audio'?`<audio controls src="${x(a.isi)}"></audio>`:`<a target=_blank rel=noopener href="${x(a.isi)}">Buka tautan</a>`):x(a.isi)}</p></div>`).join('')||'Belum ada materi.'},
modul(m,k){return DB.modul.filter(a=>a.kelas==k&&a.status=='Terbit').map(a=>`<div class=card><h3>${x(a.judul)}</h3><p><b>Tujuan:</b> ${x(a.tp)}</p><p><b>Pertanyaan pemantik:</b> ${x(a.pemantik)}</p><p>${x(a.materi)}</p><p>${x(a.aktivitas)}</p>${a.file?`<a onclick="pv('modul','${a.id}')">Buka berkas</a>`:''}</div>`).join('')||'Belum ada modul diterbitkan.'},
kuis(m,k){return DB.kuis.filter(a=>a.kelas==k).map(a=>{const h=DB.hasil.find(z=>z.kuis==a.id&&z.siswa==m.id);return`<div class=card><h3>${x(a.judul)}</h3>${+a.durasi?a.durasi+' menit':'Tanpa batas waktu'}<p>${h?`Skor Anda: <b>${h.skor}</b>`:`<button class=b onclick="mulai('${a.id}')">Mulai kuis</button>`}</p></div>`}).join('')||'Belum ada kuis.'},
tugas(m,k){return DB.tugas.filter(a=>a.kelas==k).map(a=>{const u=DB.kumpul.find(z=>z.tugas==a.id&&z.siswa==m.id);return`<div class=card><h3>${x(a.judul)}</h3><p>${x(a.instruksi)}</p><p>Tenggat: ${a.tenggat}</p>${a.file?`<a onclick="pv('tugas','${a.id}')">Lampiran</a>`:''}<p>${u?'Terkumpul. '+(u.nilai!==''?`Nilai: <b>${u.nilai}</b> - ${x(u.umpan)}`:'Menunggu penilaian.'):`<button class=b onclick="kumpul('${a.id}')">Kumpulkan</button>`}</p></div>`}).join('')||'Belum ada tugas.'},
nilai(m){const a=st(m);return`<div class=card><h3>Nilai dan umpan balik</h3>${DB.hasil.filter(h=>h.siswa==m.id).map(h=>`<p>Kuis ${x(DB.kuis.find(q=>q.id==h.kuis)?.judul)}: <b>${h.skor}</b></p>`).join('')}${DB.kumpul.filter(h=>h.siswa==m.id&&h.nilai!=='').map(h=>`<p>Tugas ${x(DB.tugas.find(q=>q.id==h.tugas)?.judul)}: <b>${h.nilai}</b> - ${x(h.umpan)}</p>`).join('')}<p>Rata-rata: <b>${a.avg??'-'}</b></p></div>`},
refleksi(m){return`<div class=card><h3>Refleksi pembelajaran</h3><form onsubmit="rf(event)"><label>Apa yang kamu pelajari hari ini? Apa yang masih sulit?<textarea name=t required></textarea></label><button class=b>Kirim refleksi</button></form></div>${DB.refleksi.filter(r=>r.siswa==m.id).map(r=>`<div class=card><small>${r.t}</small><p>${x(r.teks)}</p></div>`).join('')}`}};
function rf(e){e.preventDefault();DB.refleksi.push({id:uid(),siswa:S.id,teks:e.target.t.value,t:today()});log(sn(S.id)+' mengirim refleksi');save();render()}
function kumpul(id){modal(`<h3>Kumpulkan tugas</h3><form onsubmit="ks(event,'${id}')"><label>Jawaban teks<textarea name=t rows=5></textarea></label><label>Berkas (PDF, DOCX, JPG, PNG)<input type=file name=f accept=".pdf,.docx,.jpg,.png"></label><button class=b>Kumpulkan</button></form>`)}
async function ks(e,id){e.preventDefault();const f=e.target.f.files[0],r={id:uid(),tugas:id,siswa:S.id,teks:e.target.t.value,nilai:'',umpan:'',t:today()};
if(!f&&!r.teks.trim())return alert('Isi jawaban atau unggah berkas.');
if(f){if(!['pdf','docx','jpg','png'].includes(f.name.split('.').pop().toLowerCase())||f.size>7e5)return alert('Berkas ditolak (PDF/DOCX/JPG/PNG, maks 700 KB).');r.file={n:f.name,d:await new Promise(s=>{const a=new FileReader;a.onload=()=>s(a.result);a.readAsDataURL(f)})}}
DB.kumpul.push(r);log(sn(S.id)+' mengumpulkan tugas');save();closeM();render()}
const parse=t=>t.split('\n').filter(l=>l.trim()).map(l=>{const[a,q,o,k]=l.split('|'),y=a.trim();return{t:y,q,o:y=='bs'?['Benar','Salah']:(o||'').split(';').map(z=>z.trim()),k:(k||'').trim()}});
let QS;function mulai(id){const q=DB.kuis.find(a=>a.id==id);QS=parse(q.soal);if(q.acak=='Ya')QS.sort(()=>Math.random()-.5);
modal(`<h3>${x(q.judul)}</h3><b id=tm></b><form id=kf onsubmit="kk(event,'${id}')">${QS.map((a,i)=>`<p><b>${i+1}. ${x(a.q)}</b></p>${a.t=='uraian'?`<textarea name=q${i}></textarea>`:a.t=='isi'?`<input name=q${i}>`:a.o.map(o=>`<label class=r><input type=radio name=q${i} value="${x(o)}">${x(o)}</label>`).join('')}`).join('')}<button class=b>Kumpulkan</button></form>`);
if(+q.durasi){let t=q.durasi*60;TM=setInterval(()=>{t--;tm.textContent='Sisa waktu '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t<=0){clearInterval(TM);kf.requestSubmit()}},1000)}}
function kk(e,id){e.preventDefault();clearInterval(TM);const f=new FormData(e.target),ob=QS.map((a,i)=>[a,f.get('q'+i)]).filter(a=>a[0].t!='uraian'),b=ob.filter(([a,v])=>(v||'').trim().toLowerCase()==a.k.toLowerCase()).length,skor=ob.length?Math.round(100*b/ob.length):0;
DB.hasil.push({id:uid(),kuis:id,siswa:S.id,skor,t:today()});log(sn(S.id)+' menyelesaikan kuis (skor '+skor+')');save();closeM();alert('Skor Anda: '+skor);render()}
addEventListener('load',()=>fb.init().then(d=>{if(d)DB=d;render()}).catch(e=>{console.error(e);render()}));
</script></body></html>
